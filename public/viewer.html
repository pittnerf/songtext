<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dalszöveg megjelenítő</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page viewer-page">
    <script>
      // Pre-create the named lyrics tab while the QR-scan click may still count as a user gesture.
      window.__songtextPreopenedLyricsWindow = null;
      try {
        window.__songtextPreopenedLyricsWindow = window.open("about:blank", "songtext_lyrics");
      } catch (_err) {
        // Pop-up may be blocked; viewer.js will retry when a URL is selected.
      }
    </script>
    <header class="page-header">
      <h1 id="page-title">Most ezt énekeljük</h1>
      <p id="status-text" class="hidden">Kapcsolódás…</p>
    </header>

    <main class="page-main">
      <div class="status-bar" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="sync-status">Várakozás a dal kiválasztására</span>
      </div>

      <div id="song-content" class="viewer-empty">
        <p>Várakozás, amíg a kezelő kiválaszt egy dalt…</p>
      </div>

      <footer class="viewer-qr-footer">
        <p class="viewer-qr-label">Oszd meg másokkal — olvasd be a QR kódot</p>
        <img
          id="viewer-qr"
          class="viewer-qr-image"
          alt="QR kód a dalok oldalához"
        />
      </footer>
    </main>

    <script src="js/config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/viewer.js"></script>
  </body>
</html>
